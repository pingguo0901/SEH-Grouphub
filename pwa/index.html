<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="集团枢纽" />
  <title>星域控股集团</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <main id="content" class="content"></main>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="wa-screen" class="wa-screen hidden"></div>
  <div id="login-screen" class="login-screen hidden">
    <div class="login-box">
      <div class="login-title">集团枢纽</div>
      <div class="login-subtitle">星域集团 · 客服工作台</div>
      <input id="login-email" type="email" placeholder="邮箱" autocomplete="username" />
      <input id="login-password" type="password" placeholder="密码" autocomplete="current-password" />
      <div id="login-error" class="login-error"></div>
      <button id="login-submit" class="login-submit">登录</button>
    </div>
  </div>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" color-interpolation-filters="sRGB" aria-hidden="true"><defs id="lg-defs"></defs></svg>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="liquid-glass.js"></script>
  <script src="app.js"></script>
</body>
</html>
